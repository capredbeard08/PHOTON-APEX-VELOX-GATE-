name: photon-ci
on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPHOTON_ENABLE_AVX512=OFF
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark build
        run: cmake --build build --target photon_hotpath_bench -j2
